<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../shared/css/tokens.css">
<link rel="stylesheet" href="../../shared/css/base.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { display: grid; grid-template-columns: 1fr 380px; align-items: center; padding: 0 96px 0 72px; gap: 56px; }
  .brand { display: grid; gap: 22px; }
  .brand svg { width: 128px; height: 128px; }
  .name { font-family: var(--font-display); font-weight: 900; font-size: 150px; line-height: .82; letter-spacing: .01em; text-shadow: 0 10px 0 var(--ink-line); }
  .name span { color: var(--coin); }
  .tag { font-size: 30px; color: var(--text-2); max-width: 18em; line-height: 1.3; text-wrap: balance; }
  .kicker { font-family: var(--font-pixel); font-size: 20px; letter-spacing: .14em; color: var(--coin); }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; transform: rotate(-6deg); }
  .tile { aspect-ratio: 1; border-radius: 26px; box-shadow: 0 10px 0 var(--ink-line); display: grid; place-items: center; }
  .tile svg { width: 58%; height: 58%; }
</style>
</head>
<body>
  <div class="brand">
    <svg viewBox="0 0 64 64"><circle cx="32" cy="35" r="24" fill="#c98f00"/><circle cx="32" cy="31" r="24" fill="#ffc93c"/><circle cx="32" cy="31" r="18.5" fill="none" stroke="#2a1d00" stroke-opacity=".16" stroke-width="2.5"/><path d="M40.5 22.6A12 12 0 1 0 44 31H33.5" fill="none" stroke="#2a1d00" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <p class="kicker">Arcade · Réflexion · Gestion</p>
    <div class="name">GAME<span>VERSE</span></div>
    <p class="tag">Des mini-jeux arcade gratuits, à jouer tout de suite dans le navigateur.</p>
  </div>
  <div class="tiles">
    <div class="tile" style="background:#ffc93c"><svg viewBox="0 0 24 24" fill="none" stroke="#2a1d00" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3L5 13.5h6L10 21l8-10.5h-6z"/></svg></div>
    <div class="tile" style="background:#ff5a4e"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l5 5M11 6l-5 5"/><circle cx="16.5" cy="16.5" r="3.5"/></svg></div>
    <div class="tile" style="background:#4cc3ff"><svg viewBox="0 0 24 24" fill="none" stroke="#04263a" stroke-width="2.4"><circle cx="9" cy="10" r="5"/><circle cx="16.5" cy="15.5" r="3.5"/></svg></div>
    <div class="tile" style="background:#3ee6a8"><svg viewBox="0 0 24 24" fill="none" stroke="#032a1c" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></div>
    <div class="tile" style="background:#a68bff"><svg viewBox="0 0 24 24" fill="none" stroke="#1a1433" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg></div>
    <div class="tile" style="background:#ff8a5b"><svg viewBox="0 0 24 24" fill="none" stroke="#2a1a14" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15c3-2 5-7 9-9 3 2 2 6 0 8 3 0 6 1 9-1-2 4-7 6-12 5-2.5-.5-4.5-1.5-6-3z"/></svg></div>
  </div>
</body>
</html>
