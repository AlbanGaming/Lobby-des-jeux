<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pixel Mystère · GameVerse</title>
  <meta name="description" content="Pixel Mystère : des grilles à cocher d’après des indices chiffrés révèlent des dessins en pixels. 25 grilles de 5 × 5 à 15 × 15, un emblème du jour. Gratuit, sans pub.">
  <meta name="theme-color" content="#2b2d42">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="GameVerse">
  <meta property="og:title" content="Pixel Mystère · GameVerse">
  <meta property="og:description" content="Lis les chiffres, coche les cases, découvre le dessin.">
  <meta property="og:image" content="https://albangaming.github.io/Lobby-des-jeux/og.png">
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../apple-touch-icon.png">
  <link rel="preload" href="../../shared/fonts/big-shoulders-display.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../../shared/fonts/rubik.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../../shared/css/tokens.css">
  <link rel="stylesheet" href="../../shared/css/base.css">
  <link rel="stylesheet" href="../../shared/css/components.css">
  <link rel="stylesheet" href="../../shared/css/shell.css">
  <link rel="stylesheet" href="style.css">
  <script src="../../shared/js/fallback.js" defer></script>
  <script type="module" src="main.js"></script>
</head>
<body class="gv-game">
  <main class="gv-stage" id="stage">
    <div class="pm-wrap">
      <aside class="pm-panel" id="panel" aria-label="Grille en cours">
        <div class="pm-card">
          <canvas class="pm-preview" id="preview" width="5" height="5" aria-hidden="true"></canvas>
          <div class="pm-info">
            <h2 class="pm-title" id="title"></h2>
            <p class="pm-meta" id="meta"></p>
            <div class="pm-lives" id="lives" role="img"></div>
          </div>
        </div>
        <div class="pm-tools" id="tools"></div>
        <p class="pm-msg" id="msg" aria-live="polite"></p>
      </aside>
      <div class="pm-board" id="board" role="group"></div>
    </div>
  </main>
  <noscript><p style="padding:24px">Pixel Mystère a besoin de JavaScript pour fonctionner.</p></noscript>
</body>
</html>
