<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Alchimie · GameVerse</title>
  <meta name="description" content="Alchimie : mélange eau, feu, terre et air pour découvrir 54 éléments, de la vapeur à la pierre philosophale. Un plateau qui se remplit, une formule du jour. Gratuit, sans pub.">
  <meta name="theme-color" content="#10262b">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="GameVerse">
  <meta property="og:title" content="Alchimie · GameVerse">
  <meta property="og:description" content="Mélange les éléments, remplis ton grimoire.">
  <meta property="og:image" content="https://albangaming.github.io/Lobby-des-jeux/og.png">
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../apple-touch-icon.png">
  <link rel="preload" href="../../shared/fonts/big-shoulders-display.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../../shared/fonts/rubik.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../../shared/css/tokens.css">
  <link rel="stylesheet" href="../../shared/css/base.css">
  <link rel="stylesheet" href="../../shared/css/components.css">
  <link rel="stylesheet" href="../../shared/css/shell.css">
  <link rel="stylesheet" href="style.css">
  <script src="../../shared/js/fallback.js" defer></script>
  <script type="module" src="main.js"></script>
</head>
<body class="gv-game">
  <main class="gv-stage" id="stage">
    <div class="al-wrap">
      <section class="al-lab" aria-label="Plateau">
        <div class="al-top"><p class="al-msg" id="msg" aria-live="polite"></p><span class="al-combo" id="combo"></span></div>
        <div class="al-goal" id="goal" hidden></div>
        <div class="al-board" id="board" role="group" aria-label="Plateau d’alchimie, 5 cases sur 5"></div>
        <div class="al-tools" id="tools" role="group" aria-label="Outils"></div>
      </section>
      <aside class="al-book" aria-label="Grimoire">
        <h2 class="al-book__title">Grimoire <span id="foundCount"></span></h2>
        <ol class="al-grimoire" id="grimoire"></ol>
      </aside>
    </div>
    <div class="al-discovery" id="discovery" aria-live="polite"></div>
  </main>
  <noscript><p style="padding:24px">Alchimie a besoin de JavaScript pour fonctionner.</p></noscript>
</body>
</html>
