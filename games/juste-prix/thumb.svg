<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <style>
    .jp-tag{transform-origin:210px 18px;animation:jp-swing 1s ease-in-out infinite alternate}
    @keyframes jp-swing{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
    .jp-wheel{transform-box:fill-box;transform-origin:center;animation:jp-wheel .8s linear infinite}
    @keyframes jp-wheel{to{transform:rotate(360deg)}}
    .jp-up{animation:jp-up .5s ease-in-out infinite alternate}
    @keyframes jp-up{to{transform:translateY(-6px)}}
  </style>
