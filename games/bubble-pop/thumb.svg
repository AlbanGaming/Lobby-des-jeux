<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <style>
    .bp-a{animation:bp-up 1.4s ease-in-out infinite alternate}
    .bp-b{animation:bp-up 1.1s ease-in-out infinite alternate-reverse}
    .bp-c{animation:bp-up 1.7s ease-in-out infinite alternate}
    @keyframes bp-up{to{transform:translateY(-12px)}}
    .bp-burst{transform-box:fill-box;transform-origin:center;animation:bp-burst .5s ease-out infinite}
    @keyframes bp-burst{from{transform:scale(.6);opacity:1}to{transform:scale(1.25);opacity:.2}}
  </style>
  <defs>
    <radialGradient id="bp-bg" cx=".5" cy=".55" r=".75">
      <stop offset="0" stop-color="#16456b"/>
      <stop offset="1" stop-color="#0d2033"/>
    </radialGradient>
  </defs>
  <rect width="320" height="200" fill="url(#bp-bg)"/>
  <g fill="#4cc3ff" opacity=".18">
    <circle cx="30" cy="180" r="6"/><circle cx="70" cy="30" r="4"/><circle cx="300" cy="170" r="5"/><circle cx="250" cy="20" r="3"/>
  </g>
  <g class="bp-a">
    <circle cx="74" cy="112" r="38" fill="#1a7fb8"/><circle cx="74" cy="108" r="38" fill="#4cc3ff"/>
    <ellipse cx="60" cy="92" rx="11" ry="7" fill="#fff" opacity=".6" transform="rotate(-30 60 92)"/>
  </g>
  <g class="bp-b">
    <circle cx="150" cy="64" r="26" fill="#c98f00"/><circle cx="150" cy="61" r="26" fill="#ffc93c"/>
    <ellipse cx="141" cy="50" rx="7" ry="4.5" fill="#fff" opacity=".6" transform="rotate(-30 141 50)"/>
  </g>
  <g class="bp-c">
    <circle cx="160" cy="146" r="30" fill="#13996a"/><circle cx="160" cy="143" r="30" fill="#3ee6a8"/>
    <ellipse cx="149" cy="130" rx="8" ry="5" fill="#fff" opacity=".6" transform="rotate(-30 149 130)"/>
  </g>
  <g class="bp-a">
    <circle cx="276" cy="124" r="30" fill="#6a4fd1"/><circle cx="276" cy="121" r="30" fill="#a68bff"/>
    <ellipse cx="265" cy="108" rx="8" ry="5" fill="#fff" opacity=".6" transform="rotate(-30 265 108)"/>
  </g>
  <g class="bp-b">
    <circle cx="104" cy="40" r="14" fill="#b8281f"/><circle cx="104" cy="38" r="14" fill="#ff5a4e"/>
    <ellipse cx="99" cy="32" rx="4" ry="2.6" fill="#fff" opacity=".6" transform="rotate(-30 99 32)"/>
  </g>
  <g class="bp-c">
    <circle cx="232" cy="178" r="12" fill="#1a7fb8"/><circle cx="232" cy="176" r="12" fill="#4cc3ff"/>
  </g>
  <g transform="translate(222 62)">
    <g class="bp-burst" stroke="#ff5a4e" stroke-width="5" stroke-linecap="round">
      <path d="M0-30v-12"/><path d="M21-21l8-8"/><path d="M30 0h12"/><path d="M21 21l8 8"/><path d="M0 30v12"/><path d="M-21 21l-8 8"/><path d="M-30 0h-12"/><path d="M-21-21l-8-8"/>
    </g>
    <circle r="9" fill="#ff5a4e"/>
    <circle cx="-18" cy="-6" r="3.5" fill="#ff5a4e"/><circle cx="14" cy="16" r="3" fill="#ff5a4e"/>
  </g>
  <g transform="translate(214 100) rotate(-6)">
    <rect x="-4" y="3" width="62" height="34" rx="10" fill="#05060b"/>
    <rect x="-4" y="0" width="62" height="34" rx="10" fill="#f4efe4"/>
    <text x="27" y="27" text-anchor="middle" font-family="Big Shoulders Display, Arial Narrow, sans-serif" font-weight="900" font-size="28" fill="#0d2033">×4</text>
  </g>
</svg>
