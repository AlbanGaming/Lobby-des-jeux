<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <style>
    .rp-e{animation:rp-walk 3s linear infinite}
    .rp-e2{animation-delay:-1s}.rp-e3{animation-delay:-2s}
    @keyframes rp-walk{0%{transform:translate(0,0)}40%{transform:translate(120px,0)}100%{transform:translate(120px,90px)}}
    .rp-b{animation:rp-shot 1s linear infinite}
    @keyframes rp-shot{from{transform:translate(0,0);opacity:1}to{transform:translate(-40px,-22px);opacity:0}}
    .rp-z{animation:rp-zap .6s steps(2) infinite}
    @keyframes rp-zap{50%{opacity:0}}
  </style>
  <rect width="320" height="200" fill="#7cb860"/>
  <g fill="#6fa955"><rect x="0" y="0" width="40" height="40"/><rect x="80" y="0" width="40" height="40"/><rect x="160" y="0" width="40" height="40"/><rect x="240" y="0" width="40" height="40"/><rect x="40" y="40" width="40" height="40"/><rect x="120" y="40" width="40" height="40"/><rect x="200" y="40" width="40" height="40"/><rect x="280" y="40" width="40" height="40"/><rect x="0" y="80" width="40" height="40"/><rect x="80" y="80" width="40" height="40"/><rect x="160" y="80" width="40" height="40"/><rect x="240" y="80" width="40" height="40"/><rect x="40" y="120" width="40" height="40"/><rect x="120" y="120" width="40" height="40"/><rect x="200" y="120" width="40" height="40"/><rect x="280" y="120" width="40" height="40"/><rect x="0" y="160" width="40" height="40"/><rect x="80" y="160" width="40" height="40"/><rect x="160" y="160" width="40" height="40"/><rect x="240" y="160" width="40" height="40"/></g>
  <path d="M-10 60H180V200" fill="none" stroke="#c9a66b" stroke-width="32"/>
  <g class="rp-e"><circle cx="40" cy="60" r="10" fill="#6ab04c" stroke="#00000066" stroke-width="2"/><circle cx="37" cy="57" r="3" fill="#fff"/><circle cx="44" cy="57" r="3" fill="#fff"/></g>
  <g class="rp-e rp-e2"><ellipse cx="40" cy="60" rx="12" ry="8" fill="#a9b3c4" stroke="#00000066" stroke-width="2"/><circle cx="36" cy="57" r="2.5" fill="#fff"/></g>
  <g class="rp-e rp-e3"><circle cx="40" cy="60" r="14" fill="#8e6bbf" stroke="#00000066" stroke-width="2"/><circle cx="35" cy="56" r="3.5" fill="#fff"/><circle cx="44" cy="56" r="3.5" fill="#fff"/></g>
  <g transform="translate(120 112)"><rect x="-16" y="-6" width="32" height="20" rx="4" fill="#9aa0ae" stroke="#5a6070" stroke-width="2"/><circle cy="-8" r="9" fill="#3a3d4a"/><rect x="0" y="-13" width="16" height="9" fill="#2b2d42" transform="rotate(-30 0 -8)"/></g>
  <circle class="rp-b" cx="132" cy="96" r="5" fill="#2b2d42"/>
  <g transform="translate(240 100)"><rect x="-16" y="-6" width="32" height="20" rx="4" fill="#9aa0ae" stroke="#5a6070" stroke-width="2"/><circle cy="-14" r="7" fill="#ffc93c"/><circle cy="-14" r="12" fill="#ffc93c" opacity=".3"/></g>
  <path class="rp-z" d="M240 -14 220 20 232 24 196 60" transform="translate(0 100)" fill="none" stroke="#fff3a0" stroke-width="3"/>
  <g transform="translate(60 112)"><rect x="-16" y="-6" width="32" height="20" rx="4" fill="#9aa0ae" stroke="#5a6070" stroke-width="2"/><path d="M-4-26l8 12-8 10-8-10z" fill="#bfe9ff" stroke="#4cc3ff" stroke-width="2"/></g>
  <g transform="translate(160 186)"><rect x="-46" y="-12" width="92" height="22" rx="8" fill="#ff8a5b"/><text y="4" text-anchor="middle" font-family="Big Shoulders Display, Arial Narrow, sans-serif" font-weight="900" font-size="15" fill="#1b1626">VAGUE 15</text></g>
</svg>
