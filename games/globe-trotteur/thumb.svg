<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <style>
    .gt-g{transform-box:fill-box;transform-origin:center;animation:gt-spin 6s linear infinite}
    @keyframes gt-spin{to{transform:translateX(-60px)}}
    .gt-f{animation:gt-flag 3s steps(1) infinite;opacity:0}
    .gt-f1{animation-delay:0s}.gt-f2{animation-delay:-2s}.gt-f3{animation-delay:-1s}
    @keyframes gt-flag{0%,33%{opacity:1}34%,100%{opacity:0}}
    .gt-pin{transform-box:fill-box;transform-origin:center;animation:gt-pin 1.2s ease-out infinite}
    @keyframes gt-pin{from{transform:scale(.6);opacity:1}to{transform:scale(2.2);opacity:0}}
  </style>
  <rect width="320" height="200" fill="#0f2b46"/>
  <defs><clipPath id="gt-clip"><circle cx="105" cy="100" r="70"/></clipPath></defs>
  <circle cx="105" cy="100" r="70" fill="#1a4a72"/>
  <g clip-path="url(#gt-clip)" fill="#3ee6a8" opacity=".85">
    <g class="gt-g">
      <path d="M40 60c14-8 30-4 36 8s-6 22-2 34-10 26-22 22-16-20-20-32 0-26 8-32z"/>
      <path d="M100 52c12-4 26 2 30 12s-4 16 4 24 2 22-10 24-24-6-28-18 0-34 4-42z"/>
      <path d="M150 70c10-2 22 4 22 14s-10 14-18 12-12-22-4-26z"/>
      <path d="M100 52c12-4 26 2 30 12s-4 16 4 24 2 22-10 24-24-6-28-18 0-34 4-42z" transform="translate(120 0)"/>
      <path d="M40 60c14-8 30-4 36 8s-6 22-2 34-10 26-22 22-16-20-20-32 0-26 8-32z" transform="translate(120 0)"/>
    </g>
  </g>
  <circle cx="105" cy="100" r="70" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="3"/>
  <circle cx="118" cy="82" r="5" fill="#e63946" stroke="#fff" stroke-width="2"/>
  <circle class="gt-pin" cx="118" cy="82" r="8" fill="none" stroke="#e63946" stroke-width="2"/>
  <g transform="translate(196 52) rotate(4)">
    <rect x="-4" y="-4" width="98" height="72" rx="6" fill="#fbf6ea"/>
    <g class="gt-f gt-f1"><rect width="30" height="64" fill="#0055a4"/><rect x="30" width="30" height="64" fill="#fff"/><rect x="60" width="30" height="64" fill="#ef4135"/></g>
    <g class="gt-f gt-f2"><rect width="90" height="64" fill="#fff"/><circle cx="45" cy="32" r="19" fill="#bc002d"/></g>
    <g class="gt-f gt-f3"><rect width="90" height="64" fill="#009c3b"/><path d="M45 7l38 25-38 25L7 32z" fill="#ffdf00"/><circle cx="45" cy="32" r="14" fill="#002776"/></g>
  </g>
  <g transform="translate(244 160)"><rect x="-54" y="-13" width="108" height="24" rx="8" fill="#3ee6a8"/><text y="4" text-anchor="middle" font-family="Big Shoulders Display, Arial Narrow, sans-serif" font-weight="900" font-size="15" fill="#0f2b46">QUEL PAYS ?</text></g>
</svg>
