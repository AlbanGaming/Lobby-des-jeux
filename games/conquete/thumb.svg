<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <style>
    .cq-f{animation:cq-go 2.4s linear infinite}
    .cq-f2{animation-delay:-.25s}.cq-f3{animation-delay:-.5s}
    @keyframes cq-go{0%{transform:translate(0,0);opacity:0}8%{opacity:1}70%{transform:translate(150px,-40px);opacity:1}72%,100%{transform:translate(150px,-40px);opacity:0}}
    .cq-t{animation:cq-take 2.4s steps(1) infinite}
    @keyframes cq-take{0%,71%{fill:#5e1a20;stroke:#ff5d5d}72%,100%{fill:#14425e;stroke:#4cc3ff}}
    .cq-ring{transform-box:fill-box;transform-origin:center;animation:cq-ring 2.4s ease-out infinite}
    @keyframes cq-ring{0%,70%{transform:scale(.6);opacity:0}72%{opacity:.9}100%{transform:scale(2);opacity:0}}
  </style>
  <rect width="320" height="200" fill="#0b1220"/>
  <g stroke="#a0beff" stroke-opacity=".07"><path d="M0 40h320M0 80h320M0 120h320M0 160h320M40 0v200M80 0v200M120 0v200M160 0v200M200 0v200M240 0v200M280 0v200"/></g>
  <circle cx="70" cy="130" r="70" fill="#4cc3ff" opacity=".1"/>
  <circle cx="250" cy="70" r="60" fill="#ff5d5d" opacity=".1"/>
  <path d="M86 124 236 78" stroke="#4cc3ff" stroke-opacity=".35" stroke-width="2" stroke-dasharray="3 6"/>
  <circle cx="160" cy="160" r="15" fill="#3b4252" stroke="#8d99ae" stroke-width="3" stroke-dasharray="5 4"/>
  <text x="160" y="166" text-anchor="middle" font-family="Big Shoulders Display, Arial Narrow, sans-serif" font-weight="900" font-size="16" fill="#fff">8</text>
  <g fill="#4cc3ff"><circle cx="70" cy="104" r="5"/><circle cx="92" cy="114" r="5"/><circle cx="96" cy="140" r="5"/><circle cx="70" cy="156" r="5"/><circle cx="44" cy="140" r="5"/><circle cx="48" cy="114" r="5"/></g>
  <circle cx="70" cy="130" r="26" fill="#14425e" stroke="#4cc3ff" stroke-width="4"/>
  <text x="70" y="138" text-anchor="middle" font-family="Big Shoulders Display, Arial Narrow, sans-serif" font-weight="900" font-size="24" fill="#fff">42</text>
  <path d="M60 96v-8l5 4 5-7 5 7 5-4v8z" fill="#ffc93c"/>
  <g fill="#4cc3ff">
    <path class="cq-f" d="M90 122l10-3-6 8z"/>
    <path class="cq-f cq-f2" d="M86 128l10-3-6 8z"/>
    <path class="cq-f cq-f3" d="M92 116l10-3-6 8z"/>
  </g>
  <circle class="cq-ring" cx="250" cy="70" r="24" fill="none" stroke="#4cc3ff" stroke-width="4"/>
  <circle class="cq-t" cx="250" cy="70" r="22" stroke-width="4"/>
  <text x="250" y="77" text-anchor="middle" font-family="Big Shoulders Display, Arial Narrow, sans-serif" font-weight="900" font-size="20" fill="#fff">15</text>
  <rect x="90" y="10" width="140" height="8" rx="4" fill="#05060b" opacity=".6"/>
  <rect x="90" y="10" width="78" height="8" rx="4" fill="#4cc3ff"/>
  <rect x="168" y="10" width="50" height="8" fill="#ff5d5d"/>
</svg>
