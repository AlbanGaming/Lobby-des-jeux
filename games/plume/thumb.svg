<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <style>
    .pl-fly{animation:pl-fly .9s ease-in-out infinite alternate}
    @keyframes pl-fly{to{transform:translate(8px,-12px) rotate(-6deg)}}
    .pl-wing{transform-box:fill-box;transform-origin:50% 100%;animation:pl-wing .22s ease-in-out infinite alternate}
    @keyframes pl-wing{to{transform:scaleY(-.6)}}
    .pl-cloud{animation:pl-cloud 3s ease-in-out infinite alternate}
    @keyframes pl-cloud{to{transform:translateX(-18px)}}
  </style>
