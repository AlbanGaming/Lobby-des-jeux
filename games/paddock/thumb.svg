    <rect width="54" height="40" rx="8" fill="#f4efe4"/>
    <text x="27" y="31" text-anchor="middle" font-family="Big Shoulders Display, Arial Narrow, sans-serif" font-weight="900" font-size="28" fill="#0c1a2a">P1</text>
  </g>
