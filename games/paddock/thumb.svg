<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <style>
    .pd-c1{animation:pd-c1 1s ease-in-out infinite alternate}
    @keyframes pd-c1{to{transform:translateX(26px)}}
    .pd-c2{animation:pd-c2 1s ease-in-out infinite alternate}
    @keyframes pd-c2{to{transform:translateX(14px)}}
    .pd-flag{transform-box:fill-box;transform-origin:left center;animation:pd-flag .3s ease-in-out infinite alternate}
    @keyframes pd-flag{to{transform:skewY(-8deg) scaleX(.92)}}
  </style>
  <defs>
    <pattern id="pd-check" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#f4efe4"/><rect width="4" height="4" fill="#11131f"/><rect x="4" y="4" width="4" height="4" fill="#11131f"/>
    </pattern>
  </defs>
  <rect width="320" height="200" fill="#0f2a1e"/>
  <g fill="#14382a"><circle cx="60" cy="40" r="30"/><circle cx="280" cy="170" r="40"/><circle cx="170" cy="100" r="28"/></g>
  <path d="M-10 150H190a46 46 0 0 0 0-92H120a30 30 0 0 1 0-60" fill="none" stroke="#05060b" stroke-width="50" opacity=".4" transform="translate(0 5)"/>
  <path d="M-10 150H190a46 46 0 0 0 0-92H120a30 30 0 0 1 0-60" fill="none" stroke="#ff5a4e" stroke-width="50"/>
  <path d="M-10 150H190a46 46 0 0 0 0-92H120a30 30 0 0 1 0-60" fill="none" stroke="#f4efe4" stroke-width="50" stroke-dasharray="10 10"/>
  <path d="M-10 150H190a46 46 0 0 0 0-92H120a30 30 0 0 1 0-60" fill="none" stroke="#2a3550" stroke-width="40"/>
  <path d="M-10 150H190a46 46 0 0 0 0-92H120" fill="none" stroke="#f4efe4" stroke-width="2" stroke-dasharray="12 12" opacity=".4"/>
  <rect x="56" y="130" width="12" height="40" fill="url(#pd-check)"/>
  <g class="pd-c1">
    <g transform="translate(96 138)">
      <rect x="0" y="3" width="40" height="18" rx="7" fill="#05060b" opacity=".5"/>
      <rect x="4" y="-2" width="8" height="22" rx="2" fill="#11131f"/><rect x="28" y="-2" width="8" height="22" rx="2" fill="#11131f"/>
      <rect x="0" y="0" width="40" height="18" rx="7" fill="#4cc3ff"/>
      <rect x="34" y="-3" width="6" height="24" rx="2" fill="#1a7fb8"/>
      <circle cx="18" cy="9" r="4.5" fill="#11131f"/>
    </g>
  </g>
  <g class="pd-c2">
    <g transform="translate(40 146)">
      <rect x="4" y="-2" width="8" height="22" rx="2" fill="#11131f"/><rect x="28" y="-2" width="8" height="22" rx="2" fill="#11131f"/>
      <rect x="0" y="0" width="40" height="18" rx="7" fill="#ffc93c"/>
      <rect x="34" y="-3" width="6" height="24" rx="2" fill="#c98f00"/>
      <circle cx="18" cy="9" r="4.5" fill="#11131f"/>
    </g>
  </g>
  <g transform="translate(176 67) rotate(180)">
    <rect x="4" y="-2" width="8" height="22" rx="2" fill="#11131f"/><rect x="28" y="-2" width="8" height="22" rx="2" fill="#11131f"/>
    <rect x="0" y="0" width="40" height="18" rx="7" fill="#a68bff"/>
    <rect x="34" y="-3" width="6" height="24" rx="2" fill="#6a4fd1"/>
