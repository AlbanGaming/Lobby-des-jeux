<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <style>
    .vr-bob{animation:vr-bob .32s ease-in-out infinite alternate}
    @keyframes vr-bob{to{transform:translateY(-7px)}}
    .vr-far{animation:vr-far 3s linear infinite alternate}
    @keyframes vr-far{to{transform:translateX(-16px)}}
    .vr-near{animation:vr-near 3s linear infinite alternate}
    @keyframes vr-near{to{transform:translateX(-42px)}}
    .vr-zap{animation:vr-zap .24s steps(2) infinite}
    @keyframes vr-zap{50%{opacity:.25}}
    .vr-legs{transform-box:fill-box;transform-origin:center;animation:vr-legs .16s steps(2) infinite}
    @keyframes vr-legs{50%{transform:scaleX(-1)}}
  </style>
  <defs>
