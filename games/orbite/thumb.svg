<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <style>
    .or-orb{transform-origin:90px 140px;animation:or-orb 2.6s linear infinite}
    @keyframes or-orb{0%{transform:rotate(0)}38%{transform:rotate(250deg);opacity:1}39%,100%{transform:rotate(250deg);opacity:0}}
    .or-fly{animation:or-fly 2.6s linear infinite;opacity:0}
    @keyframes or-fly{0%,38%{opacity:0;transform:translate(0,0)}39%{opacity:1;transform:translate(0,0)}70%{opacity:1;transform:translate(118px,-68px)}71%,100%{opacity:0;transform:translate(118px,-68px)}}
    .or-ring{transform-box:fill-box;transform-origin:center;animation:or-ring 2.6s ease-out infinite}
    @keyframes or-ring{0%,70%{transform:scale(1);opacity:0}72%{opacity:1}100%{transform:scale(1.8);opacity:0}}
    .or-dash{animation:or-dash 3s linear infinite}
    @keyframes or-dash{to{stroke-dashoffset:-40}}
  </style>
  <defs><linearGradient id="or-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1026"/><stop offset="1" stop-color="#1a1446"/></linearGradient>
  <radialGradient id="or-p1" cx=".35" cy=".35"><stop offset="0" stop-color="#ff8a5b"/><stop offset="1" stop-color="#b4432a"/></radialGradient>
  <radialGradient id="or-p2" cx=".35" cy=".35"><stop offset="0" stop-color="#4cc3ff"/><stop offset="1" stop-color="#1d5f99"/></radialGradient></defs>
  <rect width="320" height="200" fill="url(#or-bg)"/>
  <circle cx="250" cy="40" r="90" fill="#5b3cc4" opacity=".18"/>
  <g fill="#fff"><rect x="30" y="30" width="2" height="2"/><rect x="140" y="20" width="2" height="2"/><rect x="290" y="150" width="2" height="2"/><rect x="180" y="170" width="2" height="2"/><rect x="60" y="80" width="1.5" height="1.5"/><rect x="300" y="90" width="1.5" height="1.5"/><rect x="210" y="110" width="1.5" height="1.5"/></g>
  <circle cx="90" cy="140" r="56" fill="none" stroke="#fff" stroke-opacity=".2" stroke-width="2" stroke-dasharray="8 8" class="or-dash"/>
  <circle cx="90" cy="140" r="28" fill="url(#or-p1)"/>
  <circle cx="230" cy="62" r="54" fill="#4cc3ff" fill-opacity=".08" stroke="#4cc3ff" stroke-opacity=".7" stroke-width="3" stroke-dasharray="8 8" class="or-dash"/>
  <circle cx="230" cy="62" r="24" fill="url(#or-p2)"/>
  <circle class="or-ring" cx="230" cy="62" r="24" fill="none" stroke="#ffc93c" stroke-width="4"/>
  <g fill="#fff3c4"><path d="M160 110l3 6 6 3-6 3-3 6-3-6-6-3 6-3z"/><path d="M190 92l2 4 4 2-4 2-2 4-2-4-4-2 4-2z"/></g>
  <g class="or-orb"><g transform="translate(90 98)"><path d="M0-10q6 7 5 17h-10q-1-10 5-17z" fill="#f4efe4" stroke="#1b1626" stroke-width="2" transform="rotate(90)"/></g></g>
  <g class="or-fly"><g transform="translate(112 130) rotate(60)"><path d="M0-10q6 7 5 17h-10q-1-10 5-17z" fill="#f4efe4" stroke="#1b1626" stroke-width="2"/><path d="M-3 8l3 8 3-8z" fill="#ffb02e"/></g></g>
  <g transform="translate(160 186)"><rect x="-44" y="-12" width="88" height="22" rx="8" fill="#c49aff"/><text y="4" text-anchor="middle" font-family="Big Shoulders Display, Arial Narrow, sans-serif" font-weight="900" font-size="15" fill="#0b1026">PARFAIT !</text></g>
</svg>
