<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GameVerse · Mini-jeux arcade gratuits</title>
  <meta name="description" content="GameVerse : des mini-jeux arcade, de réflexion et de gestion, gratuits et sans publicité, à jouer tout de suite dans le navigateur, sur ordinateur comme sur mobile.">
  <meta name="theme-color" content="#0b0c14">
  <meta name="color-scheme" content="dark">

  <!-- Partage sur les réseaux : les robots exigent des URL absolues pour l'image et la page -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="GameVerse">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:title" content="GameVerse · Mini-jeux arcade gratuits">
  <meta property="og:description" content="Des mini-jeux arcade, de réflexion et de gestion, à jouer tout de suite dans le navigateur. Sans pub, sans inscription.">
  <meta property="og:url" content="https://albangaming.github.io/Lobby-des-jeux/">
  <meta property="og:image" content="https://albangaming.github.io/Lobby-des-jeux/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Logo GameVerse et vignettes colorées de mini-jeux">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preload" href="shared/fonts/rubik.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="shared/fonts/big-shoulders-display.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="modulepreload" href="lobby/lobby.js">
  <link rel="stylesheet" href="shared/css/tokens.css">
  <link rel="stylesheet" href="shared/css/base.css">
  <link rel="stylesheet" href="shared/css/components.css">
  <link rel="stylesheet" href="lobby/lobby.css">
  <script type="module" src="lobby/lobby.js"></script>
  <noscript><style>.lb-main, .lb-footer { visibility: visible; }</style></noscript>
</head>
<body>
  <a class="skip-link" href="#jeux">Aller aux jeux</a>

  <header class="lb-header">
    <div class="lb-header__inner">
      <a class="lb-brand" href="./" aria-label="GameVerse, accueil">
        <svg class="lb-brand__mark" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="35" r="24" fill="#c98f00"/><circle cx="32" cy="31" r="24" fill="#ffc93c"/><circle cx="32" cy="31" r="18.5" fill="none" stroke="#2a1d00" stroke-opacity=".16" stroke-width="2.5"/><path d="M40.5 22.6A12 12 0 1 0 44 31H33.5" fill="none" stroke="#2a1d00" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="lb-brand__name">Game<span>Verse</span></span>
      </a>
      <div class="lb-header__right">
        <button class="icon-btn lb-search-btn" type="button" id="btnSearch" aria-label="Rechercher un jeu (touche /)"></button>
        <span class="lb-pill lb-pill--streak" id="hdrStreak" title="Série de jours consécutifs"></span>
        <span class="lb-pill lb-pill--credits" id="hdrCredits" title="Crédits"></span>
        <button class="lb-me" type="button" id="btnProfile" aria-haspopup="dialog"></button>
        <button class="icon-btn" type="button" id="btnSettings" aria-label="Paramètres" aria-haspopup="dialog"></button>
      </div>
    </div>
  </header>

  <main id="main" class="lb-main">
    <h1 class="sr-only">GameVerse, mini-jeux arcade gratuits</h1>
    <noscript><p class="panel" style="padding:var(--s-5)">GameVerse a besoin de JavaScript pour lancer ses jeux. Active-le dans ton navigateur pour jouer.</p></noscript>

    <section class="lb-hero" aria-label="À la une">
      <article class="lb-feature" id="feature"></article>
      <aside class="lb-player panel" id="player" aria-label="Ta progression"></aside>
    </section>

    <section class="lb-section" aria-labelledby="picksTitle">
      <div class="lb-section__head">
        <h2 id="picksTitle">Ta sélection</h2>
        <div class="lb-tabs" role="tablist" aria-label="Ta sélection" id="picksTabs">
          <button class="chip" role="tab" type="button" id="tab-continue" data-tab="continue" aria-controls="picksRail">Continuer</button>
          <button class="chip" role="tab" type="button" id="tab-favorites" data-tab="favorites" aria-controls="picksRail">Favoris</button>
          <button class="chip" role="tab" type="button" id="tab-top" data-tab="top" aria-controls="picksRail">Plus joués</button>
          <button class="chip" role="tab" type="button" id="tab-new" data-tab="new" aria-controls="picksRail">Nouveau</button>
        </div>
      </div>
      <div class="lb-rail" id="picksRail" role="tabpanel" tabindex="-1"></div>
    </section>

    <section class="lb-section" id="jeux" aria-labelledby="allTitle" tabindex="-1">
      <div class="lb-section__head">
        <h2 id="allTitle">Tous les jeux</h2>
        <p class="lb-count" id="gameCount" aria-live="polite"></p>
      </div>
      <div class="lb-toolbar">
        <label class="lb-search">
          <span class="lb-search__icon" id="searchIcon"></span>
          <span class="sr-only">Rechercher un jeu</span>
          <input class="lb-search__input" id="search" type="search" placeholder="Rechercher un jeu, un genre…" autocomplete="off" spellcheck="false" enterkeyhint="search">
          <span class="kbd lb-search__kbd" aria-hidden="true">/</span>
        </label>
        <div class="lb-filters" role="group" aria-label="Filtrer par catégorie" id="filters"></div>
      </div>
      <div class="lb-grid" id="grid"></div>
      <div class="lb-empty" id="empty" hidden></div>
    </section>
  </main>

  <footer class="lb-footer">
    <div class="lb-footer__inner">
      <p class="lb-footer__brand"><strong>GameVerse</strong> · mini-jeux faits main, sans publicité ni traceur.</p>
      <p class="lb-footer__note">Graphismes et sons créés pour le site. Polices sous licence SIL Open Font. Tes progrès restent dans ton navigateur.</p>
      <div class="lb-footer__links">
        <button class="btn btn--ghost btn--sm" type="button" data-open="profile">Mon profil</button>
        <button class="btn btn--ghost btn--sm" type="button" data-open="settings">Paramètres</button>
      </div>
    </div>
  </footer>

  <!-- Profil -->
  <dialog class="dialog lb-dialog lb-dialog--wide" id="dlgProfile" aria-labelledby="profileTitle">
    <div class="dialog__head">
      <h2 class="dialog__title" id="profileTitle">Mon profil</h2>
      <button class="icon-btn" type="button" data-close aria-label="Fermer"></button>
    </div>
    <div class="lb-dtabs" role="tablist" aria-label="Sections du profil">
      <button class="chip" role="tab" type="button" id="ptab-me" data-ptab="me" aria-controls="ppanel-me">Profil</button>
      <button class="chip" role="tab" type="button" id="ptab-stats" data-ptab="stats" aria-controls="ppanel-stats">Statistiques</button>
      <button class="chip" role="tab" type="button" id="ptab-ach" data-ptab="ach" aria-controls="ppanel-ach">Succès</button>
    </div>
    <div class="dialog__body">
      <div role="tabpanel" id="ppanel-me" aria-labelledby="ptab-me"></div>
      <div role="tabpanel" id="ppanel-stats" aria-labelledby="ptab-stats" hidden></div>
      <div role="tabpanel" id="ppanel-ach" aria-labelledby="ptab-ach" hidden></div>
    </div>
  </dialog>

  <!-- Paramètres -->
  <dialog class="dialog lb-dialog" id="dlgSettings" aria-labelledby="settingsTitle">
    <div class="dialog__head">
      <h2 class="dialog__title" id="settingsTitle">Paramètres</h2>
      <button class="icon-btn" type="button" data-close aria-label="Fermer"></button>
    </div>
    <div class="dialog__body" id="settingsBody"></div>
  </dialog>

  <!-- Confirmation -->
  <dialog class="dialog lb-dialog lb-dialog--narrow" id="dlgConfirm" aria-labelledby="confirmTitle">
    <div class="dialog__head">
      <h2 class="dialog__title" id="confirmTitle"></h2>
    </div>
    <div class="dialog__body">
      <p class="lb-confirm__text" id="confirmText"></p>
      <div class="lb-confirm__actions">
        <button class="btn btn--ghost" type="button" value="cancel" id="confirmNo">Annuler</button>
        <button class="btn btn--danger" type="button" value="ok" id="confirmYes"></button>
      </div>
    </div>
  </dialog>

  <input type="file" id="fileAvatar" accept="image/*" hidden>
  <input type="file" id="fileImport" accept="application/json,.json" hidden>
</body>
</html>
